type: root-www
run_list: [ "recipe[root-www_cookbook]" ]
security_groups:
  - web
  - ssh
servers_common:
  hostname: will-be-overridden
  attributes:
    base_template: common_base_template
    nitrous:
      shared_attr: sharing-is-caring
servers:
- hostname: nitrous.io
  elb: true
  region: us-east-1
  size: m1.small
  ami: ami-deadbeef
  availability_zone: us-east-1c
  attributes:
    environment: production
- hostname: sensu-usw1.nitrous.io
  size: m1.small
  region: us-west-1
  ami: ami-deadbeef
  attributes:
    environment: production
  block_devices:
  - name: /dev/sdf
    snapshot_id: snap-deadbeef
    size: 20
    delete_on_termination: 'false'
  - name: /dev/sdg
    snapshot_id: snap-deadbeef
    size: 40
    delete_on_termination: 'false'
- hostname: sensu-staging.nitrous.io
  size: m1.large
  region: us-west-1
  ami: ami-deadbeef
  attributes:
    environment: staging
  block_devices:
  - name: /dev/sdf
    snapshot_id: snap-cafedead
    size: 20
    delete_on_termination: 'false'
